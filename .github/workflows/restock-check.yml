name: TCG Restock Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Overlapping runs (a scheduled tick firing while a manual workflow_dispatch
# run is still in flight, or two scheduled ticks under GitHub-wide delay)
# should queue rather than race each other's state.json commit/push.
concurrency:
  group: restock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No shop in shops.json currently uses "render": "playwright" (all
      # shops are fetched via plain HTTP), so a full Playwright/Chromium
      # install here would just be wasted time on every run. If a shop is
      # later configured with "render": "playwright" in shops.json, re-add
      # a step here:
      #   - name: Install Playwright browser
      #     run: playwright install --with-deps chromium

      - name: Run restock check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m restock_notifier.main

      - name: Commit updated state
        run: |
          git config user.name "restock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update state.json [skip ci]"
          git pull --rebase
          git push

